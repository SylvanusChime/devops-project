# global:
#   scrape_interval: 15s
#   evaluation_interval: 15s

# scrape_configs: []



global:
  # 5s is far tighter than a production default. It is deliberate: the
  # validation run in deploy/NOTES.md lasts a couple of minutes, and a 15s
  # interval leaves too few samples for rate() and histogram_quantile() to
  # produce anything trustworthy over that window.
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    env: local

scrape_configs:
  - job_name: task-api
    static_configs:
      # "app" is the compose service name, resolved on the compose network.
      - targets: ["app:8080"]
        labels:
          service: task-api
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
