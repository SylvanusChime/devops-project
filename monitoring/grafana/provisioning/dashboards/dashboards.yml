apiVersion: 1

providers:
  - name: task-api
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    # Re-read the directory every 10s so editing the JSON on disk is visible
    # without restarting Grafana.
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
