name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref. Saves runner minutes
# and stops two runs racing to publish the same tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR rejects uppercase path segments, and github.repository preserves the
  # owner's casing. Lowercased at use site in the publish job.
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION_FILE: go.mod

# Default to read-only. Jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Static analysis and tests. Runs for every event, including forked PRs.
  # No secrets, no side effects.
  # ---------------------------------------------------------------------
  validate:
    name: validate
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Reads the version from go.mod rather than hardcoding it, so the
          # runner and local dev cannot drift -- which is exactly how a
          # gofmt-clean file starts failing in CI and nowhere else.
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: gofmt
        run: |
          # Scope to module packages so vendor/ and testdata/ are excluded.
          unformatted=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $(go list -f '{{.Dir}}' ./...)
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: test with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: build
        run: go build ./...

  # ---------------------------------------------------------------------
  # Image build + size gate + vulnerability scan.
  #
  # Builds on every event but only loads locally -- no push. A forked PR can
  # therefore exercise the full build without any credential exposure.
  # ---------------------------------------------------------------------
  image:
    name: image
    runs-on: self-hosted
    timeout-minutes: 10
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: task-api:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: enforce image size budget
        run: |
          SIZE=$(docker image inspect task-api:ci --format '{{.Size}}')
          LIMIT=$((15 * 1024 * 1024))
          echo "image size: ${SIZE} bytes (limit ${LIMIT})" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::image is ${SIZE} bytes, over the 15 MiB budget"
            exit 1
          fi

      - name: verify non-root
        run: |
          USER_CFG=$(docker image inspect task-api:ci --format '{{.Config.User}}')
          echo "configured user: ${USER_CFG}"
          if [ -z "$USER_CFG" ] || [ "$USER_CFG" = "root" ] || [ "$USER_CFG" = "0" ]; then
            echo "::error::image would run as root"
            exit 1
          fi

      # Runtime proof, not just a declaration: start the container and wait for
      # Docker itself to report healthy.
      - name: verify container reaches healthy
        run: |
          docker run -d --name ci-task-api -p 8080:8080 task-api:ci
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' ci-task-api)
            echo "attempt ${i}: ${STATUS}"
            [ "$STATUS" = "healthy" ] && break
            sleep 2
          done
          [ "$STATUS" = "healthy" ] || { docker logs ci-task-api; exit 1; }
          curl -fsS localhost:8080/healthz | grep -q '"status":"ok"'
          curl -fsS localhost:8080/metrics | grep -q 'task_api_build_info'
          docker rm -f ci-task-api

      - name: trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: task-api:ci
          format: table
          # Policy: HIGH and CRITICAL fail the build. Unfixed findings are
          # ignored because a scratch image has no package manager -- there is
          # no action to take until an upstream fix exists, and failing on them
          # would only train people to ignore the gate.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------------
  # Publish to GHCR. Pushes to main only -- never from a pull request, which
  # is what keeps fork PRs from obtaining a package-write token.
  # ---------------------------------------------------------------------
  publish:
    name: publish
    runs-on: self-hosted
    timeout-minutes: 10
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: lowercase image name
        id: meta
        run: |
          echo "image=${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Ephemeral, scoped to this run. No long-lived PAT in repo secrets.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Traceability: the sha tag pins the exact commit, and the OCI
          # revision label is written into the image by the Dockerfile.
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: record digest
        run: |
          {
            echo "### Published"
            echo ""
            echo "- image: \`${{ steps.meta.outputs.image }}:sha-${{ github.sha }}\`"
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Deploy. Real commands that stand up a runtime environment and verify it,
  # not an echo.
  #
  # The target is an ephemeral environment on the runner itself. That is a
  # deliberate boundary: the assignment does not require a long-lived public
  # URL, and provisioning cloud infrastructure would need credentials this
  # repository should not hold. See deploy/NOTES.md.
  # ---------------------------------------------------------------------
  deploy:
    name: deploy
    runs-on: self-hosted
    timeout-minutes: 10
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    environment:
      name: ephemeral
    steps:
      - uses: actions/checkout@v4

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deploy the published artifact by digest-pinned tag, not a rebuild.
      # Rebuilding here would mean the thing tested is not the thing shipped.
      - name: pull published image
        run: docker pull ${{ needs.publish.outputs.image }}:sha-${{ github.sha }}

      - name: stand up the stack
        run: |
          docker tag ${{ needs.publish.outputs.image }}:sha-${{ github.sha }} task-api:deployed
          VERSION=deployed docker compose up -d --no-build task-api prometheus grafana
          docker compose ps

      - name: wait for health
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' task-api 2>/dev/null || echo starting)
            echo "attempt ${i}: ${STATUS}"
            [ "$STATUS" = "healthy" ] && break
            sleep 2
          done
          [ "$STATUS" = "healthy" ] || { docker compose logs; exit 1; }

      - name: smoke test the deployment
        run: |
          set -euo pipefail
          curl -fsS localhost:8080/healthz | grep -q '"status":"ok"'

          ID=$(curl -fsS -X POST localhost:8080/tasks \
                 -H 'Content-Type: application/json' \
                 -d '{"title":"ci smoke"}' | sed -n 's/.*"id":\([0-9]*\).*/\1/p')
          echo "created task id=${ID}"

          curl -fsS "localhost:8080/tasks/${ID}" | grep -q 'ci smoke'
          curl -fsS -X PUT "localhost:8080/tasks/${ID}" \
            -H 'Content-Type: application/json' -d '{"done":true}' | grep -q '"done":true'
          curl -fsS localhost:8080/metrics | grep -q 'task_api_tasks_done 1'
          curl -fsS -o /dev/null -w '%{http_code}' -X DELETE "localhost:8080/tasks/${ID}" | grep -q 204

      # The scrape loop is part of the deployment. If Prometheus cannot reach
      # the app, the deploy is not actually observable and should fail.
      - name: verify prometheus target is UP
        run: |
          for i in $(seq 1 20); do
            HEALTH=$(curl -fsS 'localhost:9090/api/v1/targets?state=active' \
                     | grep -o '"health":"[a-z]*"' | head -1 || true)
            echo "attempt ${i}: ${HEALTH}"
            [ "$HEALTH" = '"health":"up"' ] && break
            sleep 3
          done
          [ "$HEALTH" = '"health":"up"' ] || { docker compose logs prometheus; exit 1; }

      - name: teardown
        if: always()
        run: docker compose down -v

